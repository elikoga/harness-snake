[project]
name = "harness-snake"
version = "0.1.0"
description = "Braille snake game: one C core compiled to native/WASM, bound from JS and Python."
readme = "NOTES.md"
requires-python = ">=3.10"

[project.scripts]
snake-view = "harness_snake.viewer:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
